<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="todo-app">
            <h1>My Todo List</h1>
            <div class="input-section">
                <input type="text" id="todoInput" placeholder="Add a new task..." />
                <button id="addBtn" onclick="addTodo()">Add</button>
            </div>
            <div class="filter-section">
                <button class="filter-btn active" data-filter="all" onclick="filterTodos('all')">All</button>
                <button class="filter-btn" data-filter="active" onclick="filterTodos('active')">Active</button>
                <button class="filter-btn" data-filter="completed" onclick="filterTodos('completed')">Completed</button>
            </div>
            <ul id="todoList" class="todo-list"></ul>
            <div class="footer">
                <span id="itemCount">0 items left</span>
                <button id="clearCompleted" onclick="clearCompleted()">Clear Completed</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
